<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Заявки</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="auth-screen" class="screen">
    <h1 class="auth-title">Заявки</h1>
    <form id="auth-form" class="auth-form">
      <label class="auth-label" for="auth-key">Ключ доступа</label>
      <input id="auth-key" class="auth-input" type="password" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button id="auth-submit" class="button button--primary" type="submit">Войти</button>
      <p id="auth-error" class="auth-error" hidden></p>
    </form>
  </main>

  <main id="list-screen" class="screen" hidden>
    <header class="header">
      <div>
        <h1 class="header-title">Заявки</h1>
        <p id="subtitle" class="header-subtitle"></p>
      </div>
      <div class="header-actions">
        <span id="conn" class="conn" data-online="false" role="status" aria-live="polite"
              title="Нет связи с облаком">
          <span class="conn-dot" aria-hidden="true"></span>
          <span class="visually-hidden">Нет связи с облаком</span>
        </span>
        <button id="logout" class="icon-button" type="button" title="Выйти" aria-label="Выйти">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <path d="m10 17 5-5-5-5"/>
            <path d="M15 12H3"/>
          </svg>
        </button>
      </div>
    </header>

    <p id="pull" class="pull" hidden></p>

    <p id="banner" class="banner" hidden></p>

    <nav id="filters" class="filters"></nav>

    <section id="list" class="list"></section>
  </main>

  <footer class="version">версия 7</footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
