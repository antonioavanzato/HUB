<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Заявки</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="auth-screen" class="screen">
    <h1 class="auth-title">Заявки</h1>
    <form id="auth-form" class="auth-form">
      <label class="auth-label" for="auth-key">Ключ доступа</label>
      <input id="auth-key" class="auth-input" type="password" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button id="auth-submit" class="button button--primary" type="submit">Войти</button>
      <p id="auth-error" class="auth-error" hidden></p>
    </form>
  </main>

  <main id="list-screen" class="screen" hidden>
    <header class="header">
      <div>
        <h1 class="header-title">Заявки</h1>
        <p id="subtitle" class="header-subtitle"></p>
      </div>
      <div class="header-actions">
        <button id="refresh" class="button button--ghost" type="button">Обновить</button>
        <button id="logout" class="button button--ghost" type="button">Выйти</button>
      </div>
    </header>

    <p id="banner" class="banner" hidden></p>

    <nav id="filters" class="filters"></nav>

    <section id="list" class="list"></section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
